name: Apply Korean command simplification

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-simplify.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/apply_simplify_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fix and validate
        run: |
          ruff check . --fix
          python -m compileall -q discord_bot tests
          pytest
          ruff check .
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify commands and add always-on deployment"
          git push
